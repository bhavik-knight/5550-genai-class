[project]
name = "market_research_assignment"
version = "0.1.0"
description = "market-research-assignment using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[google-genai,tools]==1.9.1",
    "python-dotenv",
    "jsonschema>=4.20.0",
]

[project.scripts]
market_research_assignment = "market_research_assignment.main:run"
run_crew = "market_research_assignment.main:run"
train = "market_research_assignment.main:train"
replay = "market_research_assignment.main:replay"
test = "market_research_assignment.main:test"
run_with_trigger = "market_research_assignment.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
